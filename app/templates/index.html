{% extends "base.html" %}
{% block title %}CloudMart — Shop{% endblock %}
{% block content %}
<h4 class="mb-3">Featured products</h4>
<div class="row g-3">
  {% for p in products %}
  <div class="col-6 col-md-4 col-lg-3">
    <div class="card h-100 product-card">
      <a href="{{ url_for('product_detail', product_id=p['id']) }}">
        {% if p.image_url %}
        <img src="{{ p.image_url }}" class="card-img-top p-3" alt="{{ p.name }}">
        {% else %}
        <div class="card-img-top p-3 text-center text-muted">No image</div>
        {% endif %}
      </a>
      <div class="card-body d-flex flex-column">
        <h6 class="card-title">
          <a href="{{ url_for('product_detail', product_id=p['id']) }}" class="text-decoration-none text-dark">
            {{ p.name }}
          </a>
        </h6>
        <p class="fw-bold text-danger mb-2">₹{{ "%.2f"|format(p.price) }}</p>
        <form method="POST" action="{{ url_for('add_to_cart', product_id=p['id']) }}" class="mt-auto">
          <input type="hidden" name="qty" value="1">
          <button class="btn btn-warning w-100 btn-sm">Add to Cart</button>
        </form>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
