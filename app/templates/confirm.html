{% extends "base.html" %}
{% block title %}Confirm Account - CloudMart{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h4 class="mb-3">Confirm your account</h4>
    <p class="text-muted">Enter the confirmation code sent to your email.</p>
    <form method="POST">
      <input type="hidden" name="username" value="{{ username }}">
      <div class="mb-3">
        <label class="form-label">Confirmation Code</label>
        <input type="text" name="code" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-warning w-100">Confirm</button>
    </form>
  </div>
</div>
{% endblock %}
